name: Weekly Chainlist refresh

on:
  schedule:
    # Monday at 06:17 UTC; offset avoids the busiest top-of-hour window.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-chainlist-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh registry and open PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Refresh bundled Chainlist snapshot
        run: python3 scripts/refresh_chainlist.py

      - name: Install scanner
        working-directory: scanner
        run: pip install -e ".[dev]"

      - name: Validate refreshed registry
        working-directory: scanner
        run: pytest -q

      - name: Open or update refresh PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/weekly-chainlist-refresh
          base: main
          delete-branch: true
          add-paths: scanner/src/nodeprobe/data/chains_mini.json
          commit-message: "Refresh bundled Chainlist snapshot."
          title: "Refresh bundled Chainlist snapshot"
          body: |
            Automated weekly refresh from `https://chainid.network/chains.json`.

            - Regenerated deterministically with `scripts/refresh_chainlist.py`
            - Preserves existing testnet classifications and infers new entries
            - Full scanner test suite passed before this PR was opened
            - Updates names only; unknown EVM chain IDs remain scannable

            Tracks #45.
          labels: |
            enhancement
            scanner
