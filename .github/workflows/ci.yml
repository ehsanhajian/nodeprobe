name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  scanner:
    name: Scanner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install scanner
        working-directory: scanner
        run: pip install -e ".[dev]"

      - name: Run scanner tests
        working-directory: scanner
        run: pytest -q

      - name: Verify scanner CLI
        working-directory: scanner
        run: |
          nodeprobe profiles
          nodeprobe rules | python3 -c "import json,sys; assert len(json.load(sys.stdin)) >= 10"
          nodeprobe --help
