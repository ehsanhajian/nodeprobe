name: Release untagged package version

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Tag and release when version has no GitHub tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create GitHub release for a new package version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' scanner/pyproject.toml | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "Could not read scanner package version"
            exit 1
          fi
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists; nothing to publish"
            exit 0
          fi
          python3 scripts/chainlist_release_notes.py > /tmp/release-notes.md
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-notes.md
          # GITHUB_TOKEN release events do not start other workflows; dispatch publish explicitly.
          gh workflow run publish-pypi.yml --ref "v${VERSION}"
