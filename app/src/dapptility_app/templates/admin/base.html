<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dapptility Admin{% endblock %}</title>
  <style>
    :root {
      --bg: #0b0f13;
      --surface: #111820;
      --card: #161f2b;
      --border: #1e2d3d;
      --border-hover: #2a3f54;
      --text: #e8ecf2;
      --text-secondary: #a3b1c6;
      --muted: #6b7d95;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-subtle: rgba(59,130,246,0.08);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --ok: #22c55e;
      --warn: #f59e0b;
      --radius: 10px;
      --radius-sm: 6px;
      --radius-pill: 999px;
      --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
      --shadow-lg: 0 4px 12px rgba(0,0,0,0.4);
      --transition: 150ms ease;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; transition: color var(--transition); }
    a:hover { color: var(--accent-hover); }

    /* ── Nav ── */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      height: 3.25rem;
      gap: 0;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
    }
    .topbar-brand {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      letter-spacing: -0.01em;
      margin-right: 2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .topbar-brand svg { flex-shrink: 0; }
    .topbar-nav { display: flex; gap: 0; height: 100%; }
    .topbar-link {
      display: flex;
      align-items: center;
      padding: 0 0.85rem;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: color var(--transition), border-color var(--transition);
      height: 100%;
    }
    .topbar-link:hover { color: var(--text); }
    .topbar-link.active { color: var(--text); border-bottom-color: var(--accent); }

    /* ── Layout ── */
    main {
      max-width: 1140px;
      margin: 0 auto;
      padding: 1.75rem 1.5rem 3rem;
    }
    main.wide { max-width: 1340px; }
    main:has(.discovery-page) { max-width: 1340px; }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
    }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; }
    .card h3 { font-size: 0.9rem; font-weight: 600; margin: 1rem 0 0.5rem; color: var(--text-secondary); }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      padding: 0.55rem 0.65rem;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      text-align: left;
      padding: 0.7rem 0.65rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      font-size: 0.9rem;
    }
    tbody tr { transition: background var(--transition); }
    tbody tr:hover { background: var(--accent-subtle); }
    tbody tr:last-child td { border-bottom: none; }

    /* ── Typography helpers ── */
    .muted { color: var(--muted); font-size: 0.88rem; }
    .text-sm { font-size: 0.85rem; }
    .text-xs { font-size: 0.75rem; }
    .text-secondary { color: var(--text-secondary); }
    .font-mono { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', ui-monospace, monospace; }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.55rem;
      border-radius: var(--radius-pill);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      line-height: 1.4;
    }
    .badge.critical { background: #3b1114; color: #fca5a5; }
    .badge.high { background: #3b1a0b; color: #fdba74; }
    .badge.medium { background: #3b2e0a; color: #fde68a; }
    .badge.low { background: #0c2340; color: #93c5fd; }
    .badge.info { background: #1e293b; color: #cbd5e1; }
    .badge.ok { background: #0a3622; color: #86efac; }
    .badge.warn { background: #3b2e0a; color: #fde68a; }
    .badge.neutral { background: #1e293b; color: #94a3b8; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-family: inherit;
      font-weight: 500;
      font-size: 0.85rem;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all var(--transition);
      text-decoration: none;
      white-space: nowrap;
      line-height: 1.3;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 1px 2px rgba(59,130,246,0.25);
    }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 2px 6px rgba(59,130,246,0.35); }
    .btn-secondary {
      background: var(--surface);
      color: var(--text-secondary);
      border-color: var(--border);
    }
    .btn-secondary:hover { background: var(--card); color: var(--text); border-color: var(--border-hover); }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border-color: var(--border);
    }
    .btn-ghost:hover { background: var(--surface); color: var(--text-secondary); border-color: var(--border-hover); }
    .btn-danger {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }
    .btn-danger:hover { background: var(--danger-hover); border-color: var(--danger-hover); }
    .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.8rem; }
    .btn-xs { padding: 0.25rem 0.55rem; font-size: 0.75rem; }
    .btn-icon { padding: 0.4rem; min-width: 2rem; }

    /* ── Form controls ── */
    input, select, textarea {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      margin-bottom: 0.75rem;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    select { cursor: pointer; }
    label {
      display: block;
      margin-bottom: 0.3rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* ── Grid ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; }
    .stat { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; margin-top: 0.2rem; }

    /* ── Page header ── */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .page-header h1 { margin: 0 0 0.25rem; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    .page-header .subtitle { margin: 0; color: var(--muted); font-size: 0.9rem; }

    /* ── Info panel (discovery) ── */
    .info-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.15rem 1.25rem;
      margin-bottom: 1rem;
    }
    .info-panel h3 {
      margin: 0 0 0.75rem;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 600;
    }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.25rem; }
    .info-item strong { display: block; margin-bottom: 0.3rem; font-size: 0.88rem; }
    .info-item p { margin: 0; font-size: 0.82rem; color: var(--muted); line-height: 1.55; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 0.25rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .tab {
      padding: 0.4rem 0.9rem;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--muted);
      border: 1px solid transparent;
      transition: all var(--transition);
    }
    .tab:hover { color: var(--text); background: var(--surface); }
    .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
    .tab .count { opacity: 0.7; margin-left: 0.15rem; }

    /* ── Score badge (discovery) ── */
    .score-badge { display: inline-flex; flex-direction: column; align-items: center; min-width: 3rem; }
    .score-badge .value { font-size: 1.1rem; font-weight: 700; line-height: 1; }
    .score-badge .tier { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.2rem; font-weight: 600; }
    .score-badge.high .value, .score-badge.high .tier { color: #4ade80; }
    .score-badge.medium .value, .score-badge.medium .tier { color: #fbbf24; }
    .score-badge.low .value, .score-badge.low .tier { color: #64748b; }

    /* ── Chips (discovery signals) ── */
    .chip-list { display: flex; flex-wrap: wrap; gap: 0.25rem; max-width: 280px; }
    .chip {
      font-size: 0.68rem;
      padding: 0.12rem 0.42rem;
      border-radius: 4px;
      background: #1e293b;
      color: #94a3b8;
      line-height: 1.35;
      font-weight: 500;
    }
    .chip.positive { background: #0a3622; color: #86efac; }
    .chip.negative { background: #3b1114; color: #fca5a5; }

    /* ── Misc discovery ── */
    .rpc-url { font-family: 'SF Mono', ui-monospace, monospace; font-size: 0.78rem; word-break: break-all; max-width: 300px; color: var(--text-secondary); }
    .actions-col { display: flex; flex-direction: column; gap: 0.3rem; min-width: 7rem; }
    .network-name { font-weight: 600; font-size: 0.9rem; }
    .network-meta { font-size: 0.78rem; margin-top: 0.15rem; }

    /* ── Status pills ── */
    .status-pill {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: var(--radius-pill);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: capitalize;
      letter-spacing: 0.02em;
    }
    .status-pill.new { background: #0c2340; color: #93c5fd; }
    .status-pill.promoted { background: #0a3622; color: #86efac; }
    .status-pill.dismissed { background: #1e293b; color: #64748b; }
    .status-pill.duplicate { background: #3b2e0a; color: #fde68a; }
    .status-pill.open { background: #0c2340; color: #93c5fd; }
    .status-pill.confirmed { background: #0a3622; color: #86efac; }
    .status-pill.draft { background: #3b2e0a; color: #fde68a; }
    .status-pill.published { background: #0a3622; color: #86efac; }
    .status-pill.completed { background: #0a3622; color: #86efac; }
    .status-pill.running { background: #0c2340; color: #93c5fd; }
    .status-pill.failed { background: #3b1114; color: #fca5a5; }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .pagination .pages { display: flex; gap: 0.2rem; align-items: center; }
    .pagination .page-link {
      min-width: 2rem;
      text-align: center;
      padding: 0.35rem 0.5rem;
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 500;
      transition: all var(--transition);
    }
    .pagination .page-link:hover { background: var(--surface); color: var(--text); }
    .pagination .page-link.active { background: var(--accent); color: white; }
    .pagination .page-link.disabled { opacity: 0.35; pointer-events: none; }

    /* ── Table meta ── */
    .table-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    /* ── Runs table ── */
    .runs-table td, .runs-table th { font-size: 0.82rem; }

    /* ── Detail page ── */
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.5rem; margin-bottom: 0.5rem; }
    .detail-label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
    .detail-value { font-size: 0.9rem; margin-bottom: 0.6rem; }

    /* ── Inline form row ── */
    .form-inline {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .form-inline input,
    .form-inline select {
      width: auto;
      margin-bottom: 0;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      main { padding: 1rem; }
      .page-header { flex-direction: column; }
      .info-grid { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Dapptility
    </div>
    <nav class="topbar-nav">
      <a class="topbar-link {% block nav_dashboard %}{% endblock %}" href="/admin">Dashboard</a>
      <a class="topbar-link {% block nav_projects %}{% endblock %}" href="/admin/projects">Projects</a>
      <a class="topbar-link {% block nav_discovery %}{% endblock %}" href="/admin/discovery">Discovery</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
